version: "3.7"
services:
  Kaddem:
    container_name: tpfoyer
    image: 192.168.1.6:8081/repository/v2/moetezbellah/tpfoyer17:40  # Utilisation de l'image Nexus avec version "40"
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://dbmysql:3306/tpFoyer17?createDatabaseIfNotExist=true&userSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    restart: unless-stopped
    depends_on:
      - dbmysql

  dbmysql:
    image: "mysql:5.6"
    container_name: dbmysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    restart: unless-stopped
    volumes:
      - db:/var/lib/mysql

  angular-app:
    image: moetezbellah/frontfoyer:v1
    ports:
      - "4200:80"
    restart: always

volumes:
  db:
