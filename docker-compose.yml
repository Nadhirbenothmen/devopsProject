version: "3.7"
services:
  tpfoyer17:
    image: hadilarfaoui/tpfoyer17:26

    ports:
      - "8083:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://dbmysql:3306/tpFoyer17?createDatabaseIfNotExist=true&userSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    restart: unless-stopped
    depends_on:
      - dbmysql

  dbmysql:
    image: "mysql:5.6"
    container_name: dbmysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    restart: unless-stopped
    volumes:
      - db:/var/lib/mysql

  angular-app:
    image: hadilarfaoui/foyerangular:v3

    ports:
      - "4201:80"
    restart: always

volumes:
  db:
